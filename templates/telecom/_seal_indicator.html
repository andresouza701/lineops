{% if not indicator.render_nothing %}{% if indicator.show_circle %}<span class="seal-indicator {{ indicator.css_class }}" role="img" tabindex="0" aria-label="{{ indicator.accessible_text }}" title="{{ indicator.accessible_text }}"><span class="seal-indicator__dot" aria-hidden="true"></span><span class="visually-hidden">{{ indicator.accessible_text }}</span></span>{% else %}<span class="seal-indicator {{ indicator.css_class }}">{{ indicator.accessible_text }}</span>{% endif %}{% endif %}
